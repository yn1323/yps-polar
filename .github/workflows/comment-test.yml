name: comment-test

on:
  pull_request:
    types: [ opened, reopened, synchronize ]


jobs:
  comment-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create comments
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            Storybook VRT Report
